# orrery-agent-runtime 引擎错误码（中文基文件；英文变体见 runtime-error-codes_en.properties）。
# 键为 RuntimeErrorCode 枚举名；模板与枚举内置文案保持一致。
REPEATED_TOOL_FAILURE=本轮操作连续多轮失败、没有进展，已停止以免空耗。
LLM_CALL_FAILED=模型调用失败：{0}
LLM_CANCELLED=模型调用重试等待期间被中断，本轮按取消处理。
AGENT_OUTPUT_TRUNCATED=模型输出被截断（达到长度上限），结果不完整，请缩小输出规模后重试。
TRUNCATION_CONTINUATION_EXCEEDED=模型输出被截断且自动续接失败（或达续接上限），请缩小输出规模后重试。
TOOL_ARGS_INVALID=工具 {0} 的参数不是合法 JSON，未执行；请修正参数格式后重试。
CONTENT_FILTERED=模型输出被内容安全过滤拦截，请调整输入后重试。
PIPELINE_STAGE_MISSING=阶段处理器缺失：{0}
PIPELINE_TRANSITIONS_EXCEEDED=阶段链转移次数超过上限（{0}），已熔断终止。
PIPELINE_ROLLBACKS_EXCEEDED=阶段回退次数超过预算（{0}），已熔断终止。
TOOL_TIMEOUT=工具执行超时（{0} ms），已强制取消。
TOOL_ARG_FUSE=相同参数已连续失败 {0} 次，请调整参数后重试，不要原样重复。
DAG_GRAPH_INVALID=执行计划图非法：{0}
DAG_NODE_TIMEOUT=计划节点 {0} 执行超时（{1} ms），已强制取消。
DAG_NODE_HANDLER_ERROR=计划节点 {0} 执行异常：{1}
DAG_NODE_OUTCOME_INVALID=计划节点 {0} 的处理器返回了非法结果类型。
DAG_EXECUTIONS_EXCEEDED=计划节点执行次数超过预算（{0}），已熔断终止。
