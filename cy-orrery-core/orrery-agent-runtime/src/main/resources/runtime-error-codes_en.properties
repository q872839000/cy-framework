# orrery-agent-runtime engine error codes (English variant; base file is zh-CN).
# Keys are RuntimeErrorCode enum names; missing keys fall back to the built-in
# Chinese templates in the enum.
REPEATED_TOOL_FAILURE=Tool calls kept failing for several rounds with no progress; the loop has been stopped to avoid waste.
LLM_CALL_FAILED=Model call failed: {0}
LLM_CANCELLED=Model call was interrupted during retry back-off; this round is treated as cancelled.
AGENT_OUTPUT_TRUNCATED=Model output was truncated (length limit reached); the result is incomplete. Please reduce the output size and retry.
TRUNCATION_CONTINUATION_EXCEEDED=Model output was truncated and automatic continuation failed (or hit the continuation limit). Please reduce the output size and retry.
TOOL_ARGS_INVALID=Arguments of tool {0} are not valid JSON; the tool was not executed. Please fix the argument format and retry.
CONTENT_FILTERED=Model output was blocked by the content safety filter; please adjust the input and retry.
PIPELINE_STAGE_MISSING=Stage handler missing: {0}
PIPELINE_TRANSITIONS_EXCEEDED=Stage transitions exceeded the limit ({0}); the chain has been fused out.
PIPELINE_ROLLBACKS_EXCEEDED=Stage rollbacks exceeded the budget ({0}); the chain has been fused out.
TOOL_TIMEOUT=Tool execution timed out ({0} ms) and was forcibly cancelled.
TOOL_ARG_FUSE=The same arguments have failed {0} times in a row; please adjust the arguments instead of repeating them.
DAG_GRAPH_INVALID=Execution plan graph is invalid: {0}
DAG_NODE_TIMEOUT=Plan node {0} execution timed out ({1} ms) and was forcibly cancelled.
DAG_NODE_HANDLER_ERROR=Plan node {0} handler failed: {1}
DAG_NODE_OUTCOME_INVALID=Plan node {0} handler returned an illegal outcome type.
DAG_EXECUTIONS_EXCEEDED=Plan node executions exceeded the budget ({0}); fused out.
