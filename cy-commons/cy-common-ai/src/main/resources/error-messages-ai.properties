# ============================================================
# AI 模块错误消息配置
#
# 错误码范围：40000-40999（避免与其他模块冲突）
#
# @author pcy
# @date 2026/03/09
# ============================================================

# Provider 相关错误
40901=未找到 AI Provider: {0}，当前可用: {1}
40902=默认 AI Provider ''{0}'' 未在配置中定义，当前可用: {1}
40903=未知的 Provider 协议类型: {0}
40904=无可用 Embedding Provider（请在 cy.ai.providers.<id>.embedding 启用向量模型，或检查 cy.ai.roles.embedding 路由）
40905=无可用 Rerank Provider（请在 cy.ai.providers.<id>.rerank 启用重排模型，或检查 cy.ai.roles.rerank 路由）
40906=AI Provider ''{0}'' 配置无效: {1}
40907=Provider ''{0}'' 不支持 Rerank 能力（rerank.options.model 未配置）

# API 调用相关错误
40101=AI 模型服务调用失败: HTTP {0}，厂商响应: {1}
40102=AI 请求序列化失败
