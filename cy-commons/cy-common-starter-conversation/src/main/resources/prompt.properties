# ============================================================
# 智能命名提示词配置 (优化版)
# 
# 目标：针对对话内容生成精准、概括性强的标题
# 
# 占位符说明：
# {userMessage} - 用户首条消息
# {aiResponse} - AI首条回复
# 
# 优化点：
# 1. 增加了角色设定
# 2. 明确了优先级（用户意图优先）
# 3. 细化了边界情况处理（如闲聊、问候）
# 4. 调整了字数限制以容纳更多信息量
# ============================================================

naming.prompt=角色：你是一位精准的会话命名专家。\n任务：分析用户与AI的对话，提取核心意图或主题，生成一个简短标题。\n\n规则：\n1. 长度控制在4-15个汉字之间。\n2. 无标点符号，无引号，仅输出纯文本标题。\n3. 优先概括用户的具体需求、咨询的业务或技术主题。\n4. 识别场景：\n   - 若是打招呼/寒暄，命名为“日常问候”；\n   - 若是闲聊/无目的对话，命名为“日常闲聊”；\n   - 若是编程/技术问题，提取关键技术词（如“Python多线程报错”）；\n   - 若是创作/文案，概括核心题材（如“生成营销文案”）。\n\n【对话内容】\n用户：{userMessage}\nAI：{aiResponse}\n\n【标题】
