# ============================================================

# 用户相关错误
30001=用户未登录，请先登录后再进行操作

# 会话相关错误
30002=会话不存在或已被删除
30003=无权访问该会话
30004=消息内容不能为空

# OpenAI相关错误
30101=AI服务暂时不可用，请稍后重试
30102=AI服务响应超时，请稍后重试
30103=AI服务配置错误，请联系管理员

# 命名相关错误
30201=会话命名失败，已使用默认名称
