# ============================================================
# 文件存储模块错误消息配置
#
# 错误码范围：32000-32099
# ============================================================

32000 = 文件上传失败：{0}
32001 = 文件下载失败：{0}
32002 = 文件删除失败：{0}
32003 = 文件不存在：{0}
32004 = 文件已存在，禁止覆盖：{0}
32005 = 不支持的文件存储类型：{0}，请检查 cy.filestore.type 配置及对应存储客户端依赖
32006 = MinIO 配置不完整，请检查 cy.filestore.minio.url/access-key/secret-key/bucket-name
32007 = 目标不是文件，无法删除：{0}
32008 = 本地文件存储配置不完整，请检查 cy.filestore.local.base-path
